<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>С Днём Рождения, Миша и Витя! 🎉 </title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
    .balloon {
      position: absolute;
      bottom: -100px;
      opacity: 0.8;
      animation: floatUp 12s infinite linear;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    }
    .balloon::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 14px;
      background-color: rgba(255, 255, 255, 0.6);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
    }
    .glow-text {
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(236, 72, 153, 0.4);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white relative overflow-x-hidden flex flex-col justify-between">

  <!-- Анимированный фон с шариками -->
  <div id="balloons-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

  <!-- Главный контейнер -->
  <div class="container mx-auto px-4 py-6 relative z-10 flex-grow flex flex-col items-center justify-center text-center">
    
    <!-- Шапка / Заголовок -->
    <header class="mb-6 sm:mb-8 max-w-2xl w-full">
      <div class="inline-block bg-yellow-400 text-purple-950 font-extrabold text-xs sm:text-sm uppercase px-4 py-1 rounded-full mb-3 shadow-md">
        🎂  Двойной праздник!
      </div>
      <h1 class="text-3xl sm:text-5xl md:text-6xl font-black mb-3 tracking-tight glow-text leading-tight">
        С Днём Рождения,<br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">Миша</span> 
        & 
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-orange-400">Витя</span>!
      </h1>
      <p class="text-sm sm:text-base text-purple-200 font-light px-2">
        Дорогие братья! Пусть этот день принесёт море радости, исполнения всех желаний и ярких моментов.
      </p>
    </header>

    <!-- Секция с кнопками -->
    <main class="w-full max-w-3xl my-2">
      <div class="bg-white/10 backdrop-blur-md p-4 sm:p-8 rounded-2xl sm:rounded-3xl border border-white/20 shadow-2xl">
        
        <!-- Секция видео -->
        <h2 class="text-lg sm:text-xl font-bold mb-4 text-yellow-300">
          <i class="fa-solid fa-film mr-2"></i> Видео-поздравления:
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <!-- 1. Кнопка для Миши -->
          <button onclick="openVideoModal('misha')" class="group relative overflow-hidden rounded-xl sm:rounded-2xl bg-gradient-to-r from-blue-600 to-cyan-500 p-0.5 active:scale-95 transition-all shadow-lg">
            <div class="bg-slate-900/90 backdrop-blur-sm p-3 sm:p-4 rounded-[11px] sm:rounded-[15px] h-full flex flex-row sm:flex-col items-center justify-start sm:justify-center gap-3 sm:gap-0">
              <div class="w-10 h-10 sm:w-12 sm:h-12 bg-cyan-500/20 text-cyan-400 rounded-full flex items-center justify-center sm:mb-2 shrink-0">
                <i class="fa-solid fa-play text-base sm:text-lg ml-0.5"></i>
              </div>

<div class="text-left sm:text-center">
                <h3 class="text-sm sm:text-base font-bold text-white">Видео для Миши</h3>
                <p class="text-xs text-cyan-200">Смотреть</p>
              </div>
            </div>
          </button>

          <!-- 2. Кнопка для Вити -->
          <button onclick="openVideoModal('vitya')" class="group relative overflow-hidden rounded-xl sm:rounded-2xl bg-gradient-to-r from-pink-600 to-rose-500 p-0.5 active:scale-95 transition-all shadow-lg">
            <div class="bg-slate-900/90 backdrop-blur-sm p-3 sm:p-4 rounded-[11px] sm:rounded-[15px] h-full flex flex-row sm:flex-col items-center justify-start sm:justify-center gap-3 sm:gap-0">
              <div class="w-10 h-10 sm:w-12 sm:h-12 bg-pink-500/20 text-pink-400 rounded-full flex items-center justify-center sm:mb-2 shrink-0">
                <i class="fa-solid fa-play text-base sm:text-lg ml-0.5"></i>
              </div>
              <div class="text-left sm:text-center">
                <h3 class="text-sm sm:text-base font-bold text-white">Видео для Вити</h3>
                <p class="text-xs text-pink-200">Смотреть</p>
              </div>
            </div>
          </button>

          <!-- 3. Кнопка для Миши и Вити -->
          <button onclick="openVideoModal('both')" class="group relative overflow-hidden rounded-xl sm:rounded-2xl bg-gradient-to-r from-amber-500 to-purple-600 p-0.5 active:scale-95 transition-all shadow-lg sm:col-span-1">
            <div class="bg-slate-900/90 backdrop-blur-sm p-3 sm:p-4 rounded-[11px] sm:rounded-[15px] h-full flex flex-row sm:flex-col items-center justify-start sm:justify-center gap-3 sm:gap-0">
              <div class="w-10 h-10 sm:w-12 sm:h-12 bg-purple-500/20 text-yellow-300 rounded-full flex items-center justify-center sm:mb-2 shrink-0">
                <i class="fa-solid fa-heart text-base sm:text-lg"></i>
              </div>
              <div class="text-left sm:text-center">
                <h3 class="text-sm sm:text-base font-bold text-white">Для обоих</h3>
                <p class="text-xs text-purple-200">Общее видео</p>
              </div>
            </div>
          </button>
        </div>

        <!-- Секция генератора случайных поздравлений -->
        <h2 class="text-lg sm:text-xl font-bold mb-4 text-pink-300">
          <i class="fa-solid fa-gift mr-2"></i> Пожелания-сюрпризы:
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <button onclick="showRandomWishes('misha')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:brightness-110 text-white font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-dice text-yellow-300 text-lg"></i> Случайное для Миши
          </button>
          <button onclick="showRandomWishes('vitya')" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:brightness-110 text-white font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-dice text-yellow-300 text-lg"></i> Случайное для Вити
          </button>
        </div>

        <!-- Кнопка Салют -->
        <div class="pt-4 border-t border-white/10">
          <button onclick="launchConfetti()" class="w-full sm:w-auto bg-gradient-to-r from-yellow-400 to-orange-500 text-purple-950 font-black py-3 px-6 rounded-full shadow-lg active:scale-95 transition-all inline-flex items-center justify-center gap-2 text-sm sm:text-base">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Запустить праздничный салют!
          </button>
        </div>
      </div>
    </main>

  </div>

  <!-- Футер -->
  <footer class="relative z-10 text-center py-4 text-xs text-purple-300/60 border-t border-white/10 bg-black/20">
    <p>С любовью и наилучшими пожеланиями ❤️  | 2026</p>
  </footer>

  <!-- Модальное окно для видео -->
21:16
<div id="videoModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-2 sm:p-4 bg-black/85 backdrop-blur-md transition-opacity duration-300 opacity-0">
    <div class="bg-slate-900 border border-white/20 rounded-2xl max-w-xs sm:max-w-sm w-full overflow-hidden shadow-2xl relative transform scale-95 transition-transform duration-300 flex flex-col max-h-[85vh]" id="videoModalContainer">
      
      <button onclick="closeVideoModal()" class="absolute top-2 right-2 z-20 w-9 h-9 bg-black/60 hover:bg-black/80 rounded-full flex items-center justify-center text-white transition-colors border border-white/20 shadow-lg">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="p-3 pr-12 border-b border-white/10 bg-white/5 shrink-0">
        <h3 id="videoModalTitle" class="text-xs sm:text-sm font-bold text-yellow-400 truncate">Название видео</h3>
      </div>

      <div class="relative w-full aspect-[9/16] bg-black flex items-center justify-center overflow-hidden">
        <video id="videoPlayer" class="w-full h-full object-contain" controls playsinline>
          Ваш браузер не поддерживает встроенное видео.
        </video>
      </div>

      <div class="p-3 text-center bg-white/5 shrink-0">
        <p id="videoModalDesc" class="text-xs text-slate-300 line-clamp-2">Описание видео...</p>
      </div>
    </div>
  </div>

  <!-- Модальное окно для случайных поздравлений -->
  <div id="textModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/85 backdrop-blur-md transition-opacity duration-300 opacity-0">
    <div class="bg-slate-900 border border-white/20 rounded-2xl max-w-md w-full p-6 shadow-2xl relative transform scale-95 transition-transform duration-300 text-center" id="textModalContainer">
      
      <button onclick="closeTextModal()" class="absolute top-3 right-3 w-8 h-8 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="w-16 h-16 bg-yellow-400/20 text-yellow-300 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-gift"></i>
      </div>

      <h3 id="textModalTitle" class="text-xl font-bold text-yellow-400 mb-3">Поздравление</h3>
      <p id="textModalBody" class="text-sm sm:text-base text-slate-200 leading-relaxed mb-6 bg-white/5 p-4 rounded-xl border border-white/10"></p>

      <button onclick="rollAgain()" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-purple-950 font-bold py-2.5 px-6 rounded-full shadow-md active:scale-95 transition-all text-sm">
        <i class="fa-solid fa-rotate-right mr-1"></i> Ещё пожелание!
      </button>
    </div>
  </div>

  <!-- Скрипты -->
  <script>
    const videos = {
      misha: {
        title: "🎬 Поздравление для Миши",
        url: "misha.mp4", 
        desc: "Дорогой Миша, это видео специально для тебя!"
      },
      vitya: {
        title: "🎬 Поздравление для Вити",
        url: "vitya.mp4", 
        desc: "Дорогой Витя, с днём рождения! Пусть этот год будет классным!"
      },
      both: {
        title: "🎉  Общее видео для Миши и Вити",
        url: "both.mp4", 
        desc: "Миша и Витя — одна команда! С праздником вас!"
      }
    };

    // База случайных поздравлений
    const mishaWishes = [
      "Миша, с днём рождения! Желаю тебе железобетонного здоровья, верных друзей рядом и чтобы любые преграды на пути превращались в трамплин для взлёта!",
      "Дорогой Миша! Пусть каждый день приносит отличные новости, крутые возможности и поводы для искренней улыбки. Ты человек слова и дела!",
      "Миша, желаем тебе финансового благополучия, семейного уюта и чтобы все грандиозные планы реализовывались легко и быстро!",
      "С праздником, Миша! Оставайся всегда таким же надёжным, целеустремлённым и крутым. Пусть удача идет рука об руку с тобой!"
    ];

    const vityaWishes = [

"Витя, с днём рождения! Желаем тебе неиссякаемой энергии, реализации всех амбициозных планов и чтобы во всём сопутствовала удача!",
      "Дорогой Витя! Пусть твоя жизнь будет наполнена яркими путешествиями, победами, верными людьми и большими достижениями.",
      "Витя, с праздником! Крепкого здоровья, семейного тепла, крутых возможностей и чтобы всё задуманное обязательно сбывалось!",
      "Желаем тебе, Витя, всегда двигаться только вперёд, покорять новые вершины и никогда не сомневаться в своих силах. Ты лучший!"
    ];

    let currentWishType = 'misha';

    function showRandomWishes(type) {
      currentWishType = type;
      const title = document.getElementById('textModalTitle');
      const body = document.getElementById('textModalBody');
      
      const arr = type === 'misha' ? mishaWishes : vityaWishes;
      const randomText = arr[Math.floor(Math.random() * arr.length)];

      title.innerText = type === 'misha' ? "✨ Пожелание для Миши" : "✨ Пожелание для Вити";
      body.innerText = randomText;

      openTextModal();
    }

    function rollAgain() {
      showRandomWishes(currentWishType);
      launchConfetti();
    }

    function openTextModal() {
      const modal = document.getElementById('textModal');
      const container = document.getElementById('textModalContainer');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        container.classList.remove('scale-95');
        container.classList.add('scale-100');
      }, 10);
      launchConfetti();
    }

    function closeTextModal() {
      const modal = document.getElementById('textModal');
      const container = document.getElementById('textModalContainer');
      modal.classList.add('opacity-0');
      container.classList.remove('scale-100');
      container.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function openVideoModal(type) {
      const modal = document.getElementById('videoModal');
      const container = document.getElementById('videoModalContainer');
      const title = document.getElementById('videoModalTitle');
      const player = document.getElementById('videoPlayer');
      const desc = document.getElementById('videoModalDesc');

      const data = videos[type];
      if (!data) return;

      title.innerText = data.title;
      player.src = data.url;
      player.load();
      player.play().catch(e => console.log("Автозапуск заблокирован:", e));
      desc.innerText = data.desc;

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        container.classList.remove('scale-95');
        container.classList.add('scale-100');
      }, 10);

      launchConfetti();
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const container = document.getElementById('videoModalContainer');
      const player = document.getElementById('videoPlayer');

      modal.classList.add('opacity-0');
      container.classList.remove('scale-100');
      container.classList.add('scale-95');

      setTimeout(() => {
        modal.classList.add('hidden');
        player.pause();
        player.currentTime = 0;
      }, 300);
    }

    // Закрытие модалок по клику вне их зоны
    document.getElementById('videoModal').addEventListener('click', function(e) {
      if (e.target === this) closeVideoModal();
    });
    document.getElementById('textModal').addEventListener('click', function(e) {
      if (e.target === this) closeTextModal();
    });

    function launchConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.6, x: 0.2 } });
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.6, x: 0.8 } });
      }
    }

    function createBalloons() {
      const container = document.getElementById('balloons-container');

const colors = ['#f43f5e', '#3b82f6', '#ec4899', '#8b5cf6', '#eab308', '#06b6d4'];
      const count = 10;

      for (let i = 0; i < count; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        
        const size = Math.floor(Math.random() * 20) + 35;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const delay = Math.random() * 10;
        const duration = Math.random() * 8 + 8;

        balloon.style.width = `${size}px`;
        balloon.style.height = `${size * 1.25}px`;
        balloon.style.backgroundColor = color;
        balloon.style.left = `${left}%`;
        balloon.style.animationDelay = `${delay}s`;
        balloon.style.animationDuration = `${duration}s`;

        container.appendChild(balloon);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      createBalloons();
      setTimeout(launchConfetti, 500);
    });
  </script>
</body>
</html>
